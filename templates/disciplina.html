{% extends "base.html" %}
{% block titulo %}{{ nome }}{% endblock %}
{% block conteudo %}
  <h2>Projetos de {{ nome }}</h2>
  {% if projetos %}
    <ul>
      {% for p in projetos %}
        <li><a href="{{ url_for('projeto', id=p.id) }}">{{ p.titulo }}</a> ({{ p.status }})</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Nenhum projeto encontrado nesta disciplina.</p>
  {% endif %}
{% endblock %}
