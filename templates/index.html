{% extends "base.html" %}
{% block titulo %}Projetos{% endblock %}
{% block conteudo %}
  <h2>Todos os projetos</h2>
  <div class="cards">
    {% for p in projetos %}
      <article class="card">
        <h3>{{ p.titulo }}</h3>
        <p><strong>Disciplina:</strong> {{ p.disciplina or "Sem disciplina" }}</p>
        <p><span class="status">{{ p.status }}</span></p>
        <a href="{{ url_for('projeto', id=p.id) }}">Ver detalhes</a>
      </article>
    {% else %}
      <p>Nenhum projeto cadastrado.</p>
    {% endfor %}
  </div>
{% endblock %}
